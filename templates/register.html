{% extends "base.html" %}
{% block title %}Register · Habit Buddy{% endblock %}
{% block content %}
<h1>Register</h1>
<form method="post" class="card">
  <div class="row">
    <label>First name <input type="text" name="first_name" autocomplete="given-name" required></label>
    <label>Last name <input type="text" name="last_name" autocomplete="family-name" required></label>
  </div>
  <label>Username <input type="text" name="username" autocomplete="username" required></label>
  <label>Password <input type="password" name="password" autocomplete="new-password" minlength="4" required></label>
  <button type="submit" class="primary">Register</button>
</form>
<p class="muted">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
{% endblock %}
