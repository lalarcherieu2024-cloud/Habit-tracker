<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Habit Buddy{% endblock %}</title>
  <style>
    /* Mobile first: one column, full width. Wider screens just get a max width. */
    :root {
      --bg: #f6f4ef; --card: #ffffff; --text: #222; --muted: #6b6b6b;
      --line: #e3e0d8; --accent: #d9822b; --good: #4f8a62; --bad: #c4503b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16140f; --card: #211e19; --text: #eee8dc; --muted: #a0968a;
        --line: #36322b; --good: #6fae84; --bad: #e06b55;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    nav { display: flex; align-items: center; gap: 12px; padding: 12px 16px;
          background: var(--card); border-bottom: 1px solid var(--line); }
    nav .brand { font-weight: 700; margin-right: auto; color: var(--text); text-decoration: none; }
    nav a { color: var(--muted); }
    main { max-width: 640px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.4rem; margin: 8px 0 16px; }
    h2 { font-size: 1.1rem; margin: 0 0 12px; }
    a { color: var(--accent); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
            padding: 16px; margin-bottom: 16px; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .flash { padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; animation: slide-in .3s ease; }
    @keyframes slide-in { from { opacity: 0; transform: translateY(-6px); } }
    .flash.error { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
    .flash.success { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
    label { display: block; margin-bottom: 10px; }
    input[type=text], input[type=password], input[type=number], select {
      display: block; width: 100%; margin-top: 4px; padding: 10px; font: inherit;
      color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
    button { font: inherit; padding: 10px 14px; border-radius: 8px; cursor: pointer;
             border: 1px solid var(--line); background: var(--bg); color: var(--text);
             transition: transform .1s, background .15s, color .15s; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; width: 100%; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .row > * { flex: 1 1 140px; }
    fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 0 0 10px; padding: 8px 10px; }
    fieldset label { display: inline-block; margin: 0 10px 4px 0; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <nav>
    <a class="brand" href="{{ url_for('index') }}">Habit Buddy</a>
    {% if session.user_id %}
      <a href="{{ url_for('logout') }}">Log out</a>
    {% else %}
      <a href="{{ url_for('login') }}">Log in</a>
      <a href="{{ url_for('register') }}">Register</a>
    {% endif %}
  </nav>
  <main>
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="flash {{ category }}" role="status">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
